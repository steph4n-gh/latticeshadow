name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    outputs:
      run_macos: ${{ steps.changes.outputs.run_macos }}
      run_model: ${{ steps.changes.outputs.run_model }}
      run_swift: ${{ steps.changes.outputs.run_swift }}
      run_bundle: ${{ steps.changes.outputs.run_bundle }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select macOS checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [[ "$GITHUB_REF_TYPE" == tag || "$EVENT_NAME" == workflow_dispatch ]] ||
             [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]] ||
             ! git cat-file -e "$base^{commit}"; then
            python3 scripts/validation/ci_paths.py --candidate < /dev/null >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"
          python3 scripts/validation/ci_paths.py < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/db/pyproject.toml
      - run: make setup-db
      - run: python3 -m unittest discover -s scripts/validation -p 'test_ci_paths.py'
      - run: make test-db
      - run: .venv/bin/python packages/db/scripts/verify_docs.py
      - run: .venv/bin/python packages/cli/scripts/verify_docs.py --root .

  macos:
    needs: database
    if: needs.database.outputs.run_macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/db/pyproject.toml
            packages/cli/pyproject.toml
      - uses: actions/cache@v4
        if: needs.database.outputs.run_model == 'true' || needs.database.outputs.run_bundle == 'true'
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--static-retrieval-mrl-en-v1
          key: static-retrieval-mrl-en-v1-f60985c706f192d45d218078e49e5a8b6f15283a-${{ runner.os }}-${{ runner.arch }}
      - run: make setup
      - run: make test-cli
      - name: Real model checks
        if: needs.database.outputs.run_model == 'true'
        run: make test-model
      - name: Swift companion build
        if: needs.database.outputs.run_swift == 'true'
        run: env -u SDKROOT xcrun swift build --package-path packages/cli/native -c release
      - name: Build app candidate
        if: needs.database.outputs.run_bundle == 'true'
        run: .venv/bin/python packages/cli/packaging/setup_app.py py2app
      - name: Verify bundled app
        if: needs.database.outputs.run_bundle == 'true'
        run: python3 scripts/validation/verify_app.py dist/LatticeShadow.app > app-report.json
      - name: Archive unsigned app candidate
        if: needs.database.outputs.run_bundle == 'true'
        run: ditto -c -k --sequesterRsrc --keepParent dist/LatticeShadow.app LatticeShadow-${{ github.sha }}-arm64.zip
      - name: Record candidate checksum
        if: needs.database.outputs.run_bundle == 'true'
        run: shasum -a 256 LatticeShadow-${{ github.sha }}-arm64.zip > LatticeShadow-${{ github.sha }}-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        if: needs.database.outputs.run_bundle == 'true'
        with:
          name: latticeshadow-unsigned-${{ github.sha }}
          path: |
            LatticeShadow-${{ github.sha }}-arm64.zip
            LatticeShadow-${{ github.sha }}-arm64.zip.sha256
            app-report.json
          if-no-files-found: error
          retention-days: 14

  required:
    needs: [database, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all selected jobs
        env:
          DATABASE_RESULT: ${{ needs.database.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          RUN_MACOS: ${{ needs.database.outputs.run_macos }}
        run: |
          test "$DATABASE_RESULT" = success
          if [[ "$RUN_MACOS" == true ]]; then
            test "$MACOS_RESULT" = success
          else
            case "$MACOS_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi
